# nginx config for the frontend container.
#
# Serves the React SPA from / and reverse-proxies /api/* to the backend
# container. This way one port (80 here, 443 in real deploys) handles
# everything.
#
# TLS termination: in production, put a TLS terminator (managed ELB/ALB,
# Cloudflare, or a sidecar with certs) in front. This config stays HTTP
# only so the Dockerfile doesn't need to bundle certs.

# Backend service name in the docker network. `docker-compose.prod.yml`
# declares it as `backend`.
upstream platform_backend {
    server backend:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ---- Static SPA ----
    # All non-/api routes serve the React bundle; client-side router handles
    # the actual path.
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets from react-scripts build/.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # index.html gets a short cache so deploys pick up quickly.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA fallback — anything else (e.g. /problems, /profile/abc) gets
    # the index so React Router can take over.
    location / {
        try_files $uri /index.html;
    }

    # ---- API reverse proxy ----
    location /api/ {
        proxy_pass http://platform_backend;
        proxy_http_version 1.1;

        # SSE needs the upstream to stream response chunks immediately
        # and not buffer them in nginx. Without these, /api/hints would
        # hang waiting for the full response before flushing.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections (SSE) — set a generous read timeout.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Socket.io — same SSE-style requirements.
    location /socket.io/ {
        proxy_pass http://platform_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ---- Hardening ----
    # Sensible defaults; tune in your TLS terminator.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compress text payloads.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_min_length 256;
}
