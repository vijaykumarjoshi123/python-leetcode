# Top-level volumes.
#
# `code-exchange` is a NAMED Docker volume shared between the worker and
# the executor containers it spawns. The worker writes each job's
# solution/test-case files into this volume; each executor container
# mounts the SAME named volume (read-only) so it can read them. Using a
# named volume — instead of a host bind-mount whose path depended on the
# shell's $PWD when compose ran — removes the entire class of
# "host path mismatch" bugs that previously caused every submission to
# fail (the worker told the daemon to mount a host path that didn't
# exist, so Docker silently created an empty dir and the executor found
# no solution file).
#
# `mongodb_data` persists the database across container restarts.
volumes:
  mongodb_data:
  code-exchange:

services:
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: etlninja
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # ---- Backend API ----
  # ONLY enqueues jobs into BullMQ. NO Docker socket. NO worker code.
  # The HTTP routes live here; execution happens in the `worker` service.
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/etlninja
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_key
      NODE_ENV: development
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app

  # Dedicated worker that runs the BullMQ consumer and spawns executor
  # containers. This service must have access to the Docker daemon/socket
  # so it can run executor images. For safety and clarity we keep this
  # separate from the API/backend container.
  worker:
    build: ./backend
    command: ["node", "worker.js"]
    environment:
      RUN_WORKER: '1'
      MONGODB_URI: mongodb://mongodb:27017/etlninja
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_key
      NODE_ENV: development
      # The worker writes per-job files to CODE_EXCHANGE_DIR (/code-exchange),
      # the in-container mount point of the `code-exchange` named volume. For
      # SINGLE-TOOL submissions it spawns executor containers mounting the
      # SAME named volume (CODE_EXCHANGE_VOLUME), so there is no host-path
      # to reason about.
      CODE_EXCHANGE_DIR: /code-exchange
      CODE_EXCHANGE_VOLUME: python-leetcode_code-exchange
      # Pipeline fixtures root (read-only source fixtures). The code default
      # resolves WRONG inside the worker, so we mount the host fixtures and
      # point PIPELINE_FIXTURES_ROOT at the in-container path. Without this,
      # every pipeline stage needing fixtures fails "source fixture not found".
      PIPELINE_FIXTURES_ROOT: /pipeline-fixtures
      # PIPELINE per-run scratch (per-run fixture copies + per-stage solution
      # files). Both the in-container path and its host mirror come from the
      # SAME host bind mount below, so a file the worker writes to
      # /pipeline-tmp/<x> is visible to the host daemon at
      # <repo>/pipeline-tmp/<x> — which is what the orchestrator tells the
      # daemon to bind-mount into stage containers. Without this alignment
      # every pipeline stage that needs a fixture or solution file fails.
      PIPELINE_FIXTURES_TMP: /pipeline-tmp
      PIPELINE_FIXTURES_HOST_TMP: /Users/Vijay/python-leetcode/pipeline-tmp
      PIPELINE_CODE_EXCHANGE_DIR: /pipeline-tmp
      PIPELINE_CODE_EXCHANGE_HOST_DIR: /Users/Vijay/python-leetcode/pipeline-tmp
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - code-exchange:/code-exchange
      # Host pipeline-tmp bind: shared by per-run fixture copies AND
      # per-stage solution files. Must exist on the host (created on up).
      - ./pipeline-tmp:/pipeline-tmp
      # Host pipeline fixtures -> worker, so the orchestrator can read and
      # copy them into per-run dirs before mounting into stage containers.
      - ./docker/pipeline-runner/fixtures:/pipeline-fixtures:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: on-failure


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

  # ---- Executor images ----
  # Each is built once and tagged as a stable name the worker spawns
  # on demand via `docker run`. They are NOT run as services — adding
  # `profiles:` keeps `docker-compose up` from starting idle containers.
  # To build all images explicitly:
  #   docker-compose -f docker-compose.yml -f docker-compose.build.yml build
  #
  # `python-executor` is the default executor. Its Dockerfile + runner
  # live in docker/python-executor/. The runner reads /shared/solution.py
  # (mounted from code-exchange) and writes a JSON result line to stdout.

  python-executor:
    build: ./docker/python-executor
    image: python-executor:latest
    profiles: ["build"]

  duckdb-executor:
    build: ./docker/duckdb-executor
    image: duckdb-executor:latest
    profiles: ["build"]

  pyspark-executor:
    build: ./docker/pyspark-executor
    image: pyspark-executor:latest
    profiles: ["build"]

  dbt-executor:
    build: ./docker/dbt-executor
    image: dbt-executor:latest
    profiles: ["build"]

  airflow-executor:
    build: ./docker/airflow-executor
    image: airflow-executor:latest
    profiles: ["build"]

  kafka-executor:
    build: ./docker/kafka-executor
    image: kafka-executor:latest
    profiles: ["build"]

  iceberg-executor:
    build: ./docker/iceberg-executor
    image: iceberg-executor:latest
    profiles: ["build"]

  # Tier 3 / Section 11C: pipeline orchestrator. NOT a stage executor —
  # stages use one of the 7 single-tool images above. This image is the
  # final-comparison step: the backend spawns one stage container per
  # stage, then spawns this container once with a spec describing where
  # each stage's output lives and where the expected outputs are.
  pipeline-runner:
    build: ./docker/pipeline-runner
    image: pipeline-runner:latest
    profiles: ["build"]
