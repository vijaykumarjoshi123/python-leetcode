version: '3.8'

services:
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: python-leetcode
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/python-leetcode
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_key
      NODE_ENV: development
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

  # Executor images. Each is built once and tagged as a stable name the
  # backend worker spawns on demand via `docker run`. They are NOT run as
  # services — adding `profiles:` keeps `docker-compose up` from starting
  # six idle containers. To build all images explicitly:
  #   docker-compose -f docker-compose.yml -f docker-compose.build.yml build
  duckdb-executor:
    build: ./docker/duckdb-executor
    image: duckdb-executor:latest
    profiles: ["build"]

  pyspark-executor:
    build: ./docker/pyspark-executor
    image: pyspark-executor:latest
    profiles: ["build"]

  dbt-executor:
    build: ./docker/dbt-executor
    image: dbt-executor:latest
    profiles: ["build"]

  airflow-executor:
    build: ./docker/airflow-executor
    image: airflow-executor:latest
    profiles: ["build"]

  kafka-executor:
    build: ./docker/kafka-executor
    image: kafka-executor:latest
    profiles: ["build"]

  iceberg-executor:
    build: ./docker/iceberg-executor
    image: iceberg-executor:latest
    profiles: ["build"]

volumes:
  mongodb_data:
