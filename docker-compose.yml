version: '3.8'

# Top-level volumes. `code-exchange` is the bridge between the worker
# (which writes per-job code/test-case files) and the executor containers
# (which read them at /shared). Both the worker and the executor
# containers mount this named volume at the same path so file writes
# are visible across container boundaries.
#
# `mongodb_data` persists the database across container restarts.
volumes:
  mongodb_data:

services:
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: python-leetcode
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # ---- Backend API ----
  # ONLY enqueues jobs into BullMQ. NO Docker socket. NO worker code.
  # The HTTP routes live here; execution happens in the `worker` service.
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/python-leetcode
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_key
      NODE_ENV: development
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app

  # Dedicated worker that runs the BullMQ consumer and spawns executor
  # containers. This service must have access to the Docker daemon/socket
  # so it can run executor images. For safety and clarity we keep this
  # separate from the API/backend container.
  worker:
    build: ./backend
    command: ["node", "worker.js"]
    environment:
      RUN_WORKER: '1'
      MONGODB_URI: mongodb://mongodb:27017/python-leetcode
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_key
      NODE_ENV: development
      # Inside the worker container the code-exchange dir is mounted at
      # /code-exchange. docker-compose expands ${PWD} on the host to the
      # absolute host path which the worker will pass to the `docker run -v`
      # host-side mount so the executor sees the file.
      CODE_EXCHANGE_DIR: /code-exchange
      CODE_EXCHANGE_HOST_DIR: "${PWD}/code-exchange"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - ./code-exchange:/code-exchange
      - /var/run/docker.sock:/var/run/docker.sock
    restart: on-failure


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

  # ---- Executor images ----
  # Each is built once and tagged as a stable name the worker spawns
  # on demand via `docker run`. They are NOT run as services — adding
  # `profiles:` keeps `docker-compose up` from starting idle containers.
  # To build all images explicitly:
  #   docker-compose -f docker-compose.yml -f docker-compose.build.yml build
  #
  # `python-executor` is the default executor. Its Dockerfile + runner
  # live in docker/python-executor/. The runner reads /shared/solution.py
  # (mounted from code-exchange) and writes a JSON result line to stdout.

  python-executor:
    build: ./docker/python-executor
    image: python-executor:latest
    profiles: ["build"]

  duckdb-executor:
    build: ./docker/duckdb-executor
    image: duckdb-executor:latest
    profiles: ["build"]

  pyspark-executor:
    build: ./docker/pyspark-executor
    image: pyspark-executor:latest
    profiles: ["build"]

  dbt-executor:
    build: ./docker/dbt-executor
    image: dbt-executor:latest
    profiles: ["build"]

  airflow-executor:
    build: ./docker/airflow-executor
    image: airflow-executor:latest
    profiles: ["build"]

  kafka-executor:
    build: ./docker/kafka-executor
    image: kafka-executor:latest
    profiles: ["build"]

  iceberg-executor:
    build: ./docker/iceberg-executor
    image: iceberg-executor:latest
    profiles: ["build"]

  # Tier 3 / Section 11C: pipeline orchestrator. NOT a stage executor —
  # stages use one of the 7 single-tool images above. This image is the
  # final-comparison step: the backend spawns one stage container per
  # stage, then spawns this container once with a spec describing where
  # each stage's output lives and where the expected outputs are.
  pipeline-runner:
    build: ./docker/pipeline-runner
    image: pipeline-runner:latest
    profiles: ["build"]
